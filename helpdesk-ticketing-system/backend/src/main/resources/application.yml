spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${RESEND_FROM:}
resend:
  api-key: ${RESEND_API_KEY:}
